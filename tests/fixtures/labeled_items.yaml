# Labeled candidate set for the cv-radar Phase 2.5 eval harness.
#
# Source: hand-labeled subset of historical candidate queues. Keys are stable
# arXiv ids (Item.external_id). The eval harness loads by external_id, not by
# row index, so appending new entries is safe.
#
# Labels:
#   relevant   - belongs in the top-K (curator would assign at least Watch)
#   borderline - acceptable either way; does not count toward precision
#   noise      - should NOT be in the top-K; when present it is a false
#                positive. Set `false_positive_class` so the harness can
#                break down which noise category is leaking through.
#
# Notes are short rationale strings. Tone is "why I labeled it this way",
# not a summary of the paper.
