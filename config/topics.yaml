tracks:
  - id: calibration-camera-models
    name: Calibration & Camera Models
    quadrant: perception
    # Bare `calibration` / `distortion` were dropped after they false-positived
    # on MLLM-evaluation papers ("Calibrated Accuracy", "distortion localization").
    # Use phrase keywords so the track only fires on real camera/geometry context.
    positive_keywords:
      - camera calibration
      - camera model
      - camera intrinsic
      - intrinsic calibration
      - intrinsic parameter
      - camera extrinsic
      - extrinsic calibration
      - extrinsic parameter
      - geometric calibration
      - photometric calibration
      # Added 2026-08-18. Item 9634 (Beyond Control Points: Arcsecond
      # Relative-Motion Estimation of Vision Measurement Platforms, Evaluate)
      # ranked only 18 in the 08-14 queue. It is photogrammetric metrology —
      # long-range deformation monitoring, control fields, error propagation
      # through absolute-pose differencing — and it routed on `absolute pose`,
      # `rgb-d` and `stereo` alone because the calibration track has no word for
      # the reference-geometry side of calibration.
      # Keep rate over 1981 curated items, against a 20.3% base rate:
      #   control points 50% (4 hits).
      # 2.5x the base rate, and both kept hits are exactly this class (9634 and
      # 8382, Differential 6-DOF Pose Estimation with First-Order Immunity to
      # Camera perturbation). Low volume by design — the phrase is specific.
      # Rejected: `deformation` (27% over 30 hits, barely above base and mostly
      # non-rigid mesh work), `measurement accuracy` and `dimensional
      # measurement` (1 and 0 hits).
      - control points
      - lens distortion
      - radial distortion
      - tangential distortion
      - pinhole model
      - fisheye
      - rolling shutter
      - bundle adjustment
      - hand-eye
      - homography
    negative_keywords: []

  - id: target-detection-fiducials
    name: Target Detection & Fiducials
    quadrant: perception
    positive_keywords:
      - checkerboard
      - chessboard
      - fiducial
      - aruco
      - charuco
      - calibration target
      - marker detection
      - corner detection
      - subpixel
    negative_keywords: []

  - id: 3d-geometry-reconstruction
    name: 3D Geometry & Reconstruction
    quadrant: scene
    positive_keywords:
      - 3d reconstruction
      - reconstruction
      - structure from motion
      - sfm
      - stereo
      - multi-view
      - point cloud
      - depth estimation
      - pose estimation
      - epipolar
      - triangulation
      # Added 2026-08-07. Coverage hole found while removing `github` as a
      # topic proxy: genuine matching/stereo papers (4658 Lite Any Stereo V2,
      # 4674 REDI-Match, 2772 SFMambaNet) were reaching the queue only on
      # incidental signals because the track had no word for correspondence.
      # Keep rate over 1702 curated items, against an 18.8% base rate:
      #   stereo matching 73% (11), dense matching 67% (6), image matching
      #   67% (6), photogrammetry 67% (6), disparity 53% (15), surface
      #   reconstruction 50% (14), optical flow 48% (21), correspondence
      #   44% (50), feature matching 38% (16), point cloud registration
      #   100% (3).
      # Rejected as uninformative: `descriptor` (19%, dead on the base rate),
      # `keypoint` (26%), `local feature` (25%).
      - stereo matching
      - disparity
      - surface reconstruction
      - photogrammetry
      # Added 2026-08-18 as the morphological sibling of `photogrammetry`
      # above: the matcher is whole-word, so `\bphotogrammetry\b` never fires
      # on "photogrammetric bundle adjustment" or "photogrammetric network".
      # 4 hits, 75% kept against a 20.3% base rate, all of them survey-grade
      # measurement work. Same class of miss as radiology / radiological in
      # negative_topics.yaml.
      - photogrammetric
      - correspondence
      - dense matching
      - image matching
      - feature matching
      - point cloud registration
      - optical flow
      # Added 2026-08-14. Item 9266 (Fast Iterative Five point Relative Pose
      # Estimation, Prototype) ranked only 14 in its queue: the track had no
      # word for relative-pose / robust-estimation geometry, so a paper whose
      # whole subject is the five-point problem inside RANSAC was routing on
      # `ground truth` and `pose estimation` alone. `structure from motion`
      # also missed it — the abstract says "Structure and Motion".
      # Keep rate over 1986 curated items, against a 21.1% base rate:
      #   robust estimation 100% (5), structure and motion 100% (2), 6dof
      #   100% (3), absolute pose 100% (4), ransac 78% (9), pnp 78% (9),
      #   camera pose 61% (31), relative pose 62% (13), 6-dof 54% (24).
      # These add almost no NEW items (the incremental-coverage check is 0-7
      # each) — that is the point. They are re-ranking vocabulary: geometry
      # papers that already matched the track on one generic word now match on
      # their actual subject, so they stop tying with format-track noise.
      # Both `6-dof` and `6dof` are listed because the matcher splits on
      # `[\s-]+`: `6-dof` compiles to `6[\s-]+dof` and does not match "6dof".
      # `perspective-n-point` was dropped in favour of bare `pnp` to avoid
      # double-scoring abstracts that spell out the term and then abbreviate.
      # Rejected as uninformative: `rectification` (22%, 8 incremental items
      # but only 1 kept), `visual odometry` on this track (29%),
      # `vanishing point` (1 hit, 0 kept), `essential matrix` (2 hits).
      # A/B over 60 dates: zero kept items dropped out of any queue; 9266 goes
      # rank 14 -> 1, 2900 (absolute pose, event cameras) 10 -> 3, 5086
      # (SemCityLoc 6DoF) 13 -> 5, 6953 (CSS-BA bundle adjustment) 18 -> 11.
      - relative pose
      - camera pose
      - ransac
      - pnp
      - absolute pose
      - robust estimation
      - structure and motion
      - 6-dof
      - 6dof
    # `multi-view clustering` added 2026-08-18 as a false-context guard.
    # `multi-view` is a genuine geometry keyword here, but multi-view
    # clustering is a representation-learning topic that shares nothing with
    # it except the words — 9449 (Variational Incomplete Multi-View Clustering)
    # reached rank 8 of the 08-16 queue on `multi-view` alone, with no other
    # keyword and no penalty. The phrase hits 1 item over 1981 curated items
    # and zero kept items, so the guard cannot cost a real multi-view geometry
    # paper. Chosen as a track guard rather than a negative topic because the
    # wrong sense is track-local: -12 on the track score is worth ~3x the
    # -25 global penalty after the 0.55 relevance weight.
    negative_keywords:
      - multi-view clustering

  - id: 3d-sensors
    name: 3D Sensors
    quadrant: perception
    positive_keywords:
      - lidar
      - time-of-flight
      - tof
      - structured light
      - depth camera
      - rgb-d
      - 3d sensor
      - event camera
      # Added 2026-08-12. Coverage hole exposed while A/B-ing the removal of
      # `benchmark`: two of the four kept items that removal dropped were
      # event-sensor papers (564 M2E-UAV, 7488 Neuromorphic Object Detection)
      # that were riding the format track because this one had no word for
      # them. `event camera` matches only that exact phrase, so the whole
      # "event-based <task>" literature was invisible here.
      # Keep rate over 1827 curated items, against a 19.4% base rate:
      #   event-based 60.0% (30 hits, 18 kept), neuromorphic 55.6% (9, 5).
      # That is 3x the base rate — the strongest sensor vocabulary available.
      # Rejected: `event stream` (5 hits, 20% keep) and `dynamic range` — the
      # latter looks strong (18 uncovered items, 9 kept) but every one of them
      # is an event-camera paper using "high dynamic range" as boilerplate, so
      # putting it on Sensors would double-count this same class across two
      # tracks via the strongest + 0.6*rest relevance formula.
      - event-based
      - neuromorphic
    negative_keywords: []

  - id: robotics-vision
    name: Robotics Vision
    quadrant: scene
    positive_keywords:
      - robotics
      - robot vision
      - visual servoing
      - visual odometry
      - slam
      - navigation
      - manipulation
      # Added 2026-08-07: 63% kept over 8 curated items (base rate 18.8%).
      # Item 3474 (SG2Loc) was routing on the bare word `robotics` alone.
      - visual localization
    # Added 2026-08-11. `navigation` is the weakest keyword on this track: 91
    # matches, and when it is the SOLE keyword carrying the track the keep rate
    # is 12.1% against a 19.3% base rate. The dominant wrong sense is
    # vision-and-language navigation, which has its own vocabulary and so can be
    # guarded per-track rather than penalised globally (a track guard is -12 on
    # the track score, worth ~3x a negative topic). Both phrasings hit zero kept
    # items over 1802 curated items, so no exemption is needed. Scoped
    # replacements for `navigation` itself were measured and rejected as too
    # thin to carry the track: `robot navigation` 4 hits, `visual navigation` 1,
    # `navigation system` 0.
    negative_keywords:
      - vision-language navigation
      - vision-and-language navigation

