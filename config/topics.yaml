  - id: edge-ai-deployment
    name: Edge AI & Deployment
    quadrant: tooling
    positive_keywords:
      - edge ai
      - deployment
      - quantization
      - pruning
      - tensorrt
      - onnx
      - openvino
      - embedded vision
      - real-time inference
      # Added 2026-08-11 to close a coverage hole exposed while probing
      # `deployment`. Item 7685 ("Lottery Tickets Are Not Deployment Tickets",
      # Evaluate) reached this track on the single word `deployment` because its
      # abstract says "sparsification, compression" and never "pruning"; 6162
      # (ZipDepth, Watch) says "embedded and mobile platforms", which
      # `embedded vision` does not match. Keep rate over 1802 curated items
      # against a 19.3% base rate:
      #   tinyml 100% (1), microcontroller 100% (2), jetson 75% (8),
      #   sparsification 60% (5), on-device 56% (9), embedded 42% (26),
      #   fps 33% (49).
      # Rejected as uninformative: `inference time` 20% (49, dead on the base
      # rate), `throughput` 13% (15), `low-power` 17% (6).
      - embedded
      - on-device
      - jetson
      - microcontroller
      - tinyml
      - sparsification
      - fps
      # `deployment` KEPT after measurement. It is boilerplate motivation
      # language - 211 matches, 179 of them as the sole keyword carrying this
      # track, at a 17.9% keep rate that is dead on the 19.3% base rate, i.e.
      # zero information, exactly the profile that got `github` removed.
      # Removing it was A/B'd anyway and REJECTED: 26 Ignore items pushed out,
      # but it cost three genuine edge papers - 7685 rank 25 -> 38, 6162, and
      # 4924. The additions above are the safe half of that change; revisit the
      # removal once they have accumulated enough curated evidence to carry the
      # track on their own.
    # `pruning` means network pruning here, but VLM/MLLM papers use the same word
    # for dropping *visual tokens* from a context window, and that class recurs
    # every batch (7504 Omni-Prune, 7517 WaveZip, 7523 OmniScope, 7527
    # CachedSearch, 7534 on 2026-07-25..26 alone). Suppressing the track match is
    # the right fix rather than a global penalty: the papers are not off-radar
    # because they are noisy, they are off-radar because Edge AI never applied.
    # Probed 2026-07-28: token pruning 12 Ignore / 0 kept, visual token 14/0,
    # visual tokens 11/0 — no kept item uses any of them. Both number forms are
    # listed because the matcher is whole-word: `visual token` does not fire on
    # "redundant visual tokens", which is the form most of these abstracts use.
    # 2026-08-05: `quantization` has the same problem `pruning` does — it is a
    # real Edge AI positive that diffusion-generation papers use verbatim. 8303
    # (TASQ) matched this track on `quantization` + `github` while being a
    # bit-serial precision schedule for PixArt/SANA/SDXL denoising steps. Bare
    # `diffusion model` was probed and REJECTED (24/2): it hits 5411 (latent
    # posterior sampling for 3D structure) and 6982 (a diffusion-based tracker),
    # both kept. The two phrases below are specific to the generation-efficiency
    # sub-genre — 1/0 and 1/0, thin but zero-cost — and neither appears in any
    # kept item's vocabulary.
    negative_keywords:
      - token pruning
      - visual token
      - visual tokens
      - denoising step
      # 3/0 for the plural vs 1/0 for the singular — TASQ says "every denoising
      # step" but most of this genre says "across denoising steps".
      - denoising steps
      - bit-serial
      # `bit sparsification` restores this guard's original effect. It was
      # calibrated when `quantization` was the track's only TASQ match (+18 vs
      # -24); the 08-11..08-28 line added `sparsification` as a positive, which
      # took the title to +36 and let the paper leak back onto the track.
      # 1 hit over the 2342-item decided corpus, 0 kept — genuine edge work
      # says "sparsification", not "bit sparsification" (a diffusion term).
      - bit sparsification

  - id: vision-foundation-models
    name: Vision Foundation Models
    quadrant: models
    # Bare `multimodal` was dropped after 2026-07-08 curation: across the
    # 07-03..07-07 backfill it matched 26 Ignore items and 0 promoted items —
    # it fires on generic VLM/MLLM papers (the breadth noise already partly
    # caught by the `multimodal large language` / `omnimodal` negative topics).
    # Genuine foundation-model work still matches sam / dinov2 / clip /
    # visual language model / vision foundation model / foundation model.
    positive_keywords:
      - vision foundation model
      - segmentation anything
      - sam
      - dinov2
      - clip
      - visual language model
      - foundation model
      # `multimodal` removed 2026-08-07. Over 1702 curated items it was the
      # SOLE keyword carrying this track 322 times at a 6% keep rate — against
      # an 18.8% base rate, i.e. 3x worse than chance. The word has drifted
      # into generic LLM vocabulary and no longer marks a vision foundation
      # model; `dinov2` / `sam` / `clip` / `foundation model` do the real work.
    # `video clip` / `video clips` added 2026-08-14 as a false-context guard.
    # `clip` is the model here, but whole-word matching cannot tell it from a
    # video segment, and long-video papers use the segment sense constantly
    # (9319 "video clip captioning", 9171 "per clip", 9267 "inter-clip").
    # Both plural and singular are listed because `video clip` compiles to
    # `video[\s-]+clip` and does not match "clips". Neither phrase appears in
    # ANY of the 420 kept items, so the guard cannot cost a real foundation-
    # model paper. Effect is small on its own (1 extra decided-Ignore item out
    # over 60 dates) — `clip` scores 18.3% as the sole keyword carrying this
    # track, only just under the 21.1% base rate — but it is free and correct.
    # `clip` means the CLIP model here, but it is also the ordinary English word
    # for a video segment, and codec/world-model papers use it constantly: 7792
    # ("any demonstrated clip") and 7814 ("reduces a source clip to a compact
    # bitstream") both entered the 2026-07-30 queue on this track alone. Only the
    # codec sense is guardable — `bitrate` 5 Ignore / 0 kept, strips this track
    # from 1 Ignore / 0 kept.
    # `world model` was probed for 7792 and REJECTED: it strips this track from
    # 1144, a kept item on geometric consistency in video world models. The
    # generic-video sense of `clip` therefore stays uncovered.
    # 2026-08-04: three more generic-`clip` items in one round — 8154 (JEPA
    # novelty scoring over driving clips), 8155 (SphereVideo, "frame and clip
    # levels"), 8146 (FineMoLA, "Clip-Level Supervision"). Two of the three are
    # guardable by the sense of the surrounding task, measured as items carrying
    # this track that the guard would strip (track population 406 Ignore /
    # 50 kept):
    #   * action recognition 5/0
    #   * audio-visual 6/0
    # `clip-level` — the phrase all three literally use — was probed and
    # REJECTED at 7/1: it strips 656, a kept item on clip-level uncertainty for
    # active learning. That re-confirms the note above; the generic-video sense
    # of `clip` is still not directly coverable.
    # 2026-08-06: one corner of it finally is. 8393 (EgoCross, an egocentric
    # video-QA challenge report) reached this track on `clip` from "egocentric
    # video clip". The explicit two-word `video clip` is 3 in-track / 2 Ignore /
    # 0 kept — narrow, but unlike `clip-level` it never fires on the model name
    # or on a kept item. This does not close the class; abstracts that say only
    # "clips" or "short-clip" (8434, CLIP-CC-Bench) stay uncovered.
    negative_keywords:
      - image generation
      - video generation
      - bitrate
      - action recognition
      - audio-visual
      - video clip
      - video clips

  - id: open-source-cv-tooling
    name: Open-Source CV Tooling
    quadrant: tooling
    # `github` is retained despite being a weak signal (40/118 Ignore, 1 promo in
    # the 2026-07-08 backfill): dropping it pushed the legitimate MMVIAD industrial
    # anomaly-detection anchor below the Watch threshold (see
    # test_industrial_inspection_dataset_still_matches_track). A repo link is also
    # rewarded in score_implementation, so it is a mild double-count we tolerate to
    # avoid that false negative.
    positive_keywords:
      - opencv
      - open-source
      - library
      - toolkit
      - sdk
      - computer vision toolkit
      # Duplicate `open source` removed 2026-08-11 — a correctness fix, not a
      # tuning judgement. `keyword_matches` splits the keyword on `[\s-]+` and
      # rejoins with `[\s-]+`, so `open source` and `open-source` compile to the
      # SAME regex and both fired on every match: +36 instead of +18 for a title
      # hit, +20 instead of +10 for a body hit. Every paper that merely promised
      # open-source code got this track scored twice. Removing the duplicate
      # loses zero matching coverage; `open-source` still matches "open source".
      # Measured over 49 dates: 43 decided-Ignore items pushed out of the
      # top-25 queues, zero kept items moved.
      # Removing `open-source` ENTIRELY was measured and REJECTED: 60 Ignore out
      # but it cost item 6506 (GEST-Engine, Watch) rank 12 -> 41. The word is
      # weak (199 matches, 10.1% keep vs a 19.3% base rate) but not empty, and
      # no replacement clears the base rate - `open-source framework` 12.5%,
      # `api` 12.5%, `codebase` 0%, `reference implementation` 0 hits.
      # `github` removed 2026-08-07. It was the SOLE keyword carrying this
      # track 601 times out of 807 matches, at a 17% keep rate — dead on the
      # 18.8% base rate, i.e. zero information. A repository URL in an abstract
      # is a code-availability signal, and `score_implementation` already
      # measures exactly that; using it as a topic keyword double-counted it
      # into `relevance` (weight 0.55) on top of `implementation` (0.10).
      # This track is meant to mean "an open-source CV tool", not "a paper
      # that has a repo".
    negative_keywords: []

