  - id: industrial-vision-inspection
    name: Industrial Vision Inspection
    quadrant: tooling
    positive_keywords:
      - industrial inspection
      - visual inspection
      - defect detection
      # Added 2026-08-12. The bare morphological forms are the radar's single
      # strongest vocabulary and none of them were listed — whole-word matching
      # meant `defect detection` missed "defect segmentation", "defect
      # evidence" and "surface defects", and the two two-word `* inspection`
      # phrases missed "Semiconductor Inspection" and "Real-to-Twin Inspection".
      # Keep rate over 1827 curated items, against a 19.4% base rate:
      #   defect 82.1% (28 hits), defects 77.3% (22), inspection 57.8% (45),
      #   manufacturing 69.2% (13).
      # `defect` at 4.2x the base rate is the highest-signal keyword measured
      # anywhere in this config.
      # Kept ADDITIVE on purpose. Consolidating — dropping `industrial
      # inspection` / `visual inspection` / `defect detection` in favour of the
      # bare forms they subsume — was A/B'd and REJECTED: it demoted item 2042
      # (Industrial Inspection DINOv3, Evaluate) from rank 3 to 10 and dropped
      # 4622. Unlike the `open source` / `open-source` duplicate this is not
      # double-scoring for free: the long forms are strictly more on-domain
      # than the bare ones, and the extra weight encodes that.
      # Rejected as already covered (zero incremental items over the whole
      # corpus): `textureless`, `surface normal`, `mot`, `orin`.
      - inspection
      - defect
      - defects
      - manufacturing
      - anomaly detection
      - surface inspection
      - quality control
      - metrology
      - machine vision
      # Added 2026-08-18. Coverage hole exposed by item 9453 (YOLO26-RD,
      # Evaluate) landing at rank 23 of the 08-16 queue on the single word
      # `dataset`: it carries two modules built for exactly this track — a
      # 494-parameter differentiable CLAHE that adapts contrast per tile inside
      # the network, and a Sobel-gated space-to-depth downsample — but its
      # subject words are "damage" and "pavement distress", and the track had
      # no word for damage or cracking at all.
      # Keep rate over 1981 curated items, against a 20.3% base rate:
      #   crack 86% (7 hits), damage detection 100% (2), non-destructive 67% (3).
      # `crack` at 4.2x the base rate matches `defect`: its hits are structural
      # crack segmentation, steel fatigue micrographs and infrastructure
      # inspection, with one miss.
      # Rejected: `scratch` (22%, dead on the base rate — dominated by "trained
      # from scratch"), `pavement` (33%, 3 hits), `clahe` (25%),
      # `illumination` (26% over 61 hits — high volume, no signal),
      # `distress` (1 hit), `wear` (2 hits, 0 kept), `corrosion`/`weld` (0 hits
      # — kept out until the vocabulary actually appears).
      # `surface defect` (100%, 4) was dropped as pure redundancy: bare
      # `defect` already covers every one of its hits.
      - crack
      - damage detection
      - non-destructive
    negative_keywords:
      # Added 2026-08-24. Two false-context senses reach this track through its
      # own strongest keywords, and a per-track guard is worth ~3x a negative
      # topic (-12 on the track score vs ~-3.8 on the final score).
      #
      # `ai-generated image`: 9849 (AGIDefect-4K) hit rank 2 of the 08-21 queue
      # because its "defects" are generative artifacts in synthesised images,
      # firing `defect`, `defect detection` AND `defects` at once. 1 on-track
      # hit, 0 kept.
      #
      # `clinical`: medical papers reach this track on the phrase "manual
      # visual inspection" — 9974 (X-LMC, collateral scoring from digital
      # subtraction angiography) reached rank 7 of the 08-19 queue that way,
      # and the global `clinical` negative alone was not enough to sink it.
      # 5 on-track hits, 0 kept.
      #
      # Rejected as guards on this track because they hit kept items:
      # `video anomaly detection` (15 on-track hits, 5 kept — incl. 6730 O-VAD
      # industrial video anomaly detection and 9143 frame-level AUC auditing)
      # and `surveillance` (7, 2). Not added because they have zero on-track
      # hits today and would be speculative: `forensic`, `forgery`, `deepfake`
      # — the global negatives above already cover that class.
      - ai-generated image
      - clinical
      #
      # `transcription` added 2026-08-28. 10420 (AraMS-28k, a historical Arabic
      # manuscript dataset) reached rank 8 of the 08-27 queue matching this
      # track on `quality control` in the editorial sense — the manuscript's
      # transcriptions are what is being quality-controlled, not a part. The
      # global `transcription` negative alone left it at rank ~13; the track
      # guard is what evicts it, the usual ~3x (-12 on the track score vs -3.8
      # on the final score). 1 on-track hit, 0 kept — the same standard
      # `ai-generated image` was accepted on.
      - transcription
      - transcriptions

  - id: edge-ai-deployment
    name: Edge AI & Deployment
    quadrant: tooling
    positive_keywords:
      - edge ai
      - deployment
      - quantization
      - pruning
      - tensorrt
      - onnx
      - openvino
      - embedded vision
      - real-time inference
      # Added 2026-08-11 to close a coverage hole exposed while probing
      # `deployment`. Item 7685 ("Lottery Tickets Are Not Deployment Tickets",
      # Evaluate) reached this track on the single word `deployment` because its
      # abstract says "sparsification, compression" and never "pruning"; 6162
      # (ZipDepth, Watch) says "embedded and mobile platforms", which
      # `embedded vision` does not match. Keep rate over 1802 curated items
      # against a 19.3% base rate:
      #   tinyml 100% (1), microcontroller 100% (2), jetson 75% (8),
      #   sparsification 60% (5), on-device 56% (9), embedded 42% (26),
      #   fps 33% (49).
      # Rejected as uninformative: `inference time` 20% (49, dead on the base
      # rate), `throughput` 13% (15), `low-power` 17% (6).
      - embedded
      - on-device
      - jetson
      - microcontroller
      - tinyml
      - sparsification
      - fps
      # `deployment` KEPT after measurement. It is boilerplate motivation
      # language - 211 matches, 179 of them as the sole keyword carrying this
      # track, at a 17.9% keep rate that is dead on the 19.3% base rate, i.e.
      # zero information, exactly the profile that got `github` removed.
      # Removing it was A/B'd anyway and REJECTED: 26 Ignore items pushed out,
      # but it cost three genuine edge papers - 7685 rank 25 -> 38, 6162, and
      # 4924. The additions above are the safe half of that change; revisit the
      # removal once they have accumulated enough curated evidence to carry the
      # track on their own.
    negative_keywords: []

  - id: vision-foundation-models
    name: Vision Foundation Models
    quadrant: models
    positive_keywords:
      - vision foundation model
      - segmentation anything
      - sam
      - dinov2
      - clip
      - visual language model
      - foundation model
      # `multimodal` removed 2026-08-07. Over 1702 curated items it was the
      # SOLE keyword carrying this track 322 times at a 6% keep rate — against
      # an 18.8% base rate, i.e. 3x worse than chance. The word has drifted
      # into generic LLM vocabulary and no longer marks a vision foundation
      # model; `dinov2` / `sam` / `clip` / `foundation model` do the real work.
    # `video clip` / `video clips` added 2026-08-14 as a false-context guard.
    # `clip` is the model here, but whole-word matching cannot tell it from a
    # video segment, and long-video papers use the segment sense constantly
    # (9319 "video clip captioning", 9171 "per clip", 9267 "inter-clip").
    # Both plural and singular are listed because `video clip` compiles to
    # `video[\s-]+clip` and does not match "clips". Neither phrase appears in
    # ANY of the 420 kept items, so the guard cannot cost a real foundation-
    # model paper. Effect is small on its own (1 extra decided-Ignore item out
    # over 60 dates) — `clip` scores 18.3% as the sole keyword carrying this
    # track, only just under the 21.1% base rate — but it is free and correct.
    negative_keywords:
      - image generation
      - video generation
      - video clip
      - video clips

  - id: open-source-cv-tooling
    name: Open-Source CV Tooling
    quadrant: tooling
    positive_keywords:
      - opencv
      - open-source
      - library
      - toolkit
      - sdk
      - computer vision toolkit
      # Duplicate `open source` removed 2026-08-11 — a correctness fix, not a
      # tuning judgement. `keyword_matches` splits the keyword on `[\s-]+` and
      # rejoins with `[\s-]+`, so `open source` and `open-source` compile to the
      # SAME regex and both fired on every match: +36 instead of +18 for a title
      # hit, +20 instead of +10 for a body hit. Every paper that merely promised
      # open-source code got this track scored twice. Removing the duplicate
      # loses zero matching coverage; `open-source` still matches "open source".
      # Measured over 49 dates: 43 decided-Ignore items pushed out of the
      # top-25 queues, zero kept items moved.
      # Removing `open-source` ENTIRELY was measured and REJECTED: 60 Ignore out
      # but it cost item 6506 (GEST-Engine, Watch) rank 12 -> 41. The word is
      # weak (199 matches, 10.1% keep vs a 19.3% base rate) but not empty, and
      # no replacement clears the base rate - `open-source framework` 12.5%,
      # `api` 12.5%, `codebase` 0%, `reference implementation` 0 hits.
      # `github` removed 2026-08-07. It was the SOLE keyword carrying this
      # track 601 times out of 807 matches, at a 17% keep rate — dead on the
      # 18.8% base rate, i.e. zero information. A repository URL in an abstract
      # is a code-availability signal, and `score_implementation` already
      # measures exactly that; using it as a topic keyword double-counted it
      # into `relevance` (weight 0.55) on top of `implementation` (0.10).
      # This track is meant to mean "an open-source CV tool", not "a paper
      # that has a repo".
    negative_keywords: []

