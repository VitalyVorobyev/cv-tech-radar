tracks:
  - id: calibration-camera-models
    name: Calibration & Camera Models
    quadrant: perception
    # Bare `calibration` / `distortion` were dropped after they false-positived
    # on MLLM-evaluation papers ("Calibrated Accuracy", "distortion localization").
    # Use phrase keywords so the track only fires on real camera/geometry context.
    positive_keywords:
      - camera calibration
      - camera model
      - camera intrinsic
      - intrinsic calibration
      - intrinsic parameter
      - camera extrinsic
      - extrinsic calibration
      - extrinsic parameter
      - geometric calibration
      - photometric calibration
      # Added 2026-08-18. Item 9634 (Beyond Control Points: Arcsecond
      # Relative-Motion Estimation of Vision Measurement Platforms, Evaluate)
      # ranked only 18 in the 08-14 queue. It is photogrammetric metrology —
      # long-range deformation monitoring, control fields, error propagation
      # through absolute-pose differencing — and it routed on `absolute pose`,
      # `rgb-d` and `stereo` alone because the calibration track has no word for
      # the reference-geometry side of calibration.
      # Keep rate over 1981 curated items, against a 20.3% base rate:
      #   control points 50% (4 hits).
      # 2.5x the base rate, and both kept hits are exactly this class (9634 and
      # 8382, Differential 6-DOF Pose Estimation with First-Order Immunity to
      # Camera perturbation). Low volume by design — the phrase is specific.
      # Rejected: `deformation` (27% over 30 hits, barely above base and mostly
      # non-rigid mesh work), `measurement accuracy` and `dimensional
      # measurement` (1 and 0 hits).
      - control points
      - lens distortion
      - radial distortion
      - tangential distortion
      - pinhole model
      - fisheye
      - rolling shutter
      - bundle adjustment
      - hand-eye
      - homography
      # 2026-08-05, a false *negative* for once. 8262 (PLS-Calib: extrinsic
      # rotation calibration between an event camera and wheel odometry under
      # ground-plane motion) scored 21.9 and matched only 3D Sensors, on
      # `event camera` — this track never fired despite an abstract centred on
      # extrinsic calibration. Cause is whole-word matching: the abstract says
      # "extrinsic *rotation* calibration", which is not the contiguous phrase
      # `extrinsic calibration`, and "circular calibration *targets*", which is
      # not `calibration target`. Both additions are measured over the full
      # 8325-item corpus, not just the decided part:
      #   * `rotation calibration` — 1 hit, kept. Narrow by construction.
      #   * `calibration accuracy` — 4 hits, 3 kept (4110 LiDAR-camera extrinsics
      #     via 3DGS, 6889 CalibBEV, 8262) and 1 Ignore that is already heavily
      #     penalised as autonomous-driving data. This is the generalising one:
      #     calibration papers report accuracy, evaluation papers do not.
      - rotation calibration
      - calibration accuracy
    negative_keywords: []

  - id: target-detection-fiducials
    name: Target Detection & Fiducials
    quadrant: perception
    positive_keywords:
      - checkerboard
      - chessboard
      - fiducial
      - aruco
      - charuco
      - calibration target
      # The plural is its own phrase under whole-word matching: `calibration
      # target` does not fire on "circular calibration targets" (8262, 2026-08-05)
      # or on 5622 (rolling-shutter self-calibration). 3 corpus hits, 2 decided,
      # both Evaluate, zero Ignore.
      - calibration targets
      - marker detection
      - corner detection
      - subpixel
    # `checkerboard` is also the name of the autoregressive context pattern in
    # learned image compression — 2026-07-21 candidate 18 (6653, "Wavefront
    # Parallelization for Efficient Learned Image Compression") entered the queue
    # on the *calibration-target* track purely because it cites the checkerboard
    # context model. Nothing in this track's vocabulary overlaps compression, so
    # the guard cannot cost a real fiducial paper its track.
    negative_keywords:
      - image compression
      - context model

  - id: 3d-geometry-reconstruction
    name: 3D Geometry & Reconstruction
    quadrant: scene
    positive_keywords:
      - 3d reconstruction
      - reconstruction
      - structure from motion
      - sfm
      - stereo
      - multi-view
      - point cloud
      - depth estimation
      - pose estimation
      - epipolar
      - triangulation
      # Added 2026-08-07. Coverage hole found while removing `github` as a
      # topic proxy: genuine matching/stereo papers (4658 Lite Any Stereo V2,
      # 4674 REDI-Match, 2772 SFMambaNet) were reaching the queue only on
      # incidental signals because the track had no word for correspondence.
      # Keep rate over 1702 curated items, against an 18.8% base rate:
      #   stereo matching 73% (11), dense matching 67% (6), image matching
      #   67% (6), photogrammetry 67% (6), disparity 53% (15), surface
      #   reconstruction 50% (14), optical flow 48% (21), correspondence
      #   44% (50), feature matching 38% (16), point cloud registration
      #   100% (3).
      # Rejected as uninformative: `descriptor` (19%, dead on the base rate),
      # `keypoint` (26%), `local feature` (25%).
      - stereo matching
      - disparity
      - surface reconstruction
      - photogrammetry
      # Added 2026-08-18 as the morphological sibling of `photogrammetry`
      # above: the matcher is whole-word, so `\bphotogrammetry\b` never fires
      # on "photogrammetric bundle adjustment" or "photogrammetric network".
      # 4 hits, 75% kept against a 20.3% base rate, all of them survey-grade
      # measurement work. Same class of miss as radiology / radiological in
      # negative_topics.yaml.
      - photogrammetric
      - correspondence
      - dense matching
      - image matching
      - feature matching
      - point cloud registration
      - optical flow
      # Added 2026-08-14. Item 9266 (Fast Iterative Five point Relative Pose
      # Estimation, Prototype) ranked only 14 in its queue: the track had no
      # word for relative-pose / robust-estimation geometry, so a paper whose
      # whole subject is the five-point problem inside RANSAC was routing on
      # `ground truth` and `pose estimation` alone. `structure from motion`
      # also missed it — the abstract says "Structure and Motion".
      # Keep rate over 1986 curated items, against a 21.1% base rate:
      #   robust estimation 100% (5), structure and motion 100% (2), 6dof
      #   100% (3), absolute pose 100% (4), ransac 78% (9), pnp 78% (9),
      #   camera pose 61% (31), relative pose 62% (13), 6-dof 54% (24).
      # These add almost no NEW items (the incremental-coverage check is 0-7
      # each) — that is the point. They are re-ranking vocabulary: geometry
      # papers that already matched the track on one generic word now match on
      # their actual subject, so they stop tying with format-track noise.
      # Both `6-dof` and `6dof` are listed because the matcher splits on
      # `[\s-]+`: `6-dof` compiles to `6[\s-]+dof` and does not match "6dof".
      # `perspective-n-point` was dropped in favour of bare `pnp` to avoid
      # double-scoring abstracts that spell out the term and then abbreviate.
      # Rejected as uninformative: `rectification` (22%, 8 incremental items
      # but only 1 kept), `visual odometry` on this track (29%),
      # `vanishing point` (1 hit, 0 kept), `essential matrix` (2 hits).
      # A/B over 60 dates: zero kept items dropped out of any queue; 9266 goes
      # rank 14 -> 1, 2900 (absolute pose, event cameras) 10 -> 3, 5086
      # (SemCityLoc 6DoF) 13 -> 5, 6953 (CSS-BA bundle adjustment) 18 -> 11.
      - relative pose
      - camera pose
      - ransac
      - pnp
      - absolute pose
      - robust estimation
      - structure and motion
      - 6-dof
      - 6dof
    # `multi-view clustering` added 2026-08-18 as a false-context guard.
    # `multi-view` is a genuine geometry keyword here, but multi-view
    # clustering is a representation-learning topic that shares nothing with
    # it except the words — 9449 (Variational Incomplete Multi-View Clustering)
    # reached rank 8 of the 08-16 queue on `multi-view` alone, with no other
    # keyword and no penalty. The phrase hits 1 item over 1981 curated items
    # and zero kept items, so the guard cannot cost a real multi-view geometry
    # paper. Chosen as a track guard rather than a negative topic because the
    # wrong sense is track-local: -12 on the track score is worth ~3x the
    # -25 global penalty after the 0.55 relevance weight.
    # Bare `reconstruction` is this track's broadest positive and the single
    # largest false-context source in the 2026-07-30 queue: FIVE of its 25
    # candidates matched here on the wrong sense of the word — 7779 ("video
    # reconstruction" in a captioning paper), 7770 ("target reconstruction" in a
    # distillation paper), 7872 and 7861 (human-body generation/mesh). Narrowing
    # the keyword is not an option (it is the track's core term), so the wrong
    # senses are guarded by their own vocabulary instead.
    # Measured over the decided corpus, as items carrying this track that the
    # guard would strip: captioning 3 Ignore / 0 kept, full-body 4/0,
    # dynamic human 5/0. All three are also global negatives — repeating them
    # here removes the relevance boost, not just the penalty.
    # No guard is offered for 7770: its wrong sense is distillation, and both
    # `distillation` and `knowledge distillation` hit kept items (see
    # negative_topics.yaml). That one stays uncovered by design.
    # 2026-08-03: three more wrong senses of `reconstruction`, measured as items
    # carrying this track that the guard would penalise (in-track Ignore/kept,
    # over a track population of 372 Ignore / 179 kept):
    #   * clinical 16/0 — "reconstruction parameters" in CT/CBCT acquisition and
    #     "reconstruction residuals" in medical anomaly detection. 7925 (CBCT-IQ)
    #     and 7949 (OCT/OCTA) are this round's instances.
    #   * video diffusion 12/0 — generative video priors, where "reconstruction"
    #     means re-rendering rather than geometry. Corpus-wide this phrase is
    #     23/1, so it is deliberately scoped to this track and NOT made a global
    #     negative. Video-diffusion priors are creeping into legitimate novel-view
    #     work, so this is the guard most likely to need revisiting.
    #   * multimodal large language 10/0 — already a global negative; repeating it
    #     here strips the track as well as applying the penalty.
    # 2026-08-04: two more wrong senses of `reconstruction`, measured as items
    # carrying this track that the guard would penalise (over a track population
    # of 358 Ignore / 180 kept):
    #   * action recognition 4/0 — 8073 (Event ActivityNet) is here purely on
    #     "action-center reconstruction LPIPS", a diagnostic metric inside a
    #     video action-localization benchmark.
    #   * image fusion 3/0 — infrared-visible fusion papers, where
    #     "reconstruction" means re-synthesising the fused image.
    # Both are also global negatives; repeating them here strips the track as
    # well, so the item loses the relevance boost and not only the penalty.
    #
    # Recorded as NOT fixable: the largest single noise class in the 2026-08-04
    # round was novel-view-synthesis / Gaussian-splatting rendering papers — 7 of
    # 40 Ignores (8039 UniqueSplat, 8124 D^2-4DGS, 8071 FAST-GS, 8001 InfiniSplat,
    # 8172 QuerySplat, 8059 ChunkVAE, 8135 GaussianSelector), all reaching this
    # track on `3d reconstruction` / `reconstruction` / `multi-view` with zero
    # penalty. Every discriminating phrase was probed against the decided corpus
    # and every one hits kept items: `novel view synthesis` 21/9, `view synthesis`
    # 26/9, `gaussian splatting` 48/22, `3dgs` 29/14, `psnr` 16/2, `photorealistic`
    # 11/2, `rendering quality` 11/4, `radiance field` 0/1. The kept items
    # (7226 GLAM-SLAM, 5079 Structured-Li-GS, 4110 geometry-preserving 3DGS for
    # LiDAR-camera extrinsics, 6371 SalientGS) share the rendering vocabulary
    # exactly — what separates them is the *presence* of geometry/sensor terms,
    # which a negative_keywords list cannot express. This class needs the scoring
    # re-weight, not another phrase.
    #
    # 2026-08-05: two more wrong senses of `reconstruction`, both from the 08-04
    # queue, measured corpus-wide (Ignore/kept over 1652/309):
    #   * low-bit 4/0 — post-training quantization, where "reconstruction" means
    #     re-fitting a quantized layer to its full-precision output. 8193 (NAP)
    #     is this round's instance: ImageNet/CIFAR quantization, no geometry
    #     anywhere in it. `post-training quantization` was probed and REJECTED
    #     (5/2) — it hits 7481 (on-device model adaptation) and 7547, both kept.
    #   * electron tomography 1/0 — 8268 (NanoMorph-3D) reconstructs
    #     nanomaterials from TEM tilt series. Materials-science instrumentation;
    #     the missing-wedge problem has no analogue in our 3D work. `nanomaterial`
    #     (1/0) is listed alongside it so the guard fires on either wording.
    # All three are thin, but this track's `reconstruction` positive is the
    # radar's single largest false-context source and each guard is provably
    # zero-cost. No global negative is warranted for any of them.
    negative_keywords:
      - captioning
      - full-body
      - dynamic human
      - clinical
      - video diffusion
      - multimodal large language
      - action recognition
      - image fusion
      - low-bit
      - electron tomography
      - nanomaterial
      - nanomaterials
      - multi-view clustering

  - id: 3d-sensors
    name: 3D Sensors
    quadrant: perception
    positive_keywords:
      - lidar
      - time-of-flight
      - tof
      - structured light
      - depth camera
      - rgb-d
      - 3d sensor
      - event camera
      # Added 2026-08-12. Coverage hole exposed while A/B-ing the removal of
      # `benchmark`: two of the four kept items that removal dropped were
      # event-sensor papers (564 M2E-UAV, 7488 Neuromorphic Object Detection)
      # that were riding the format track because this one had no word for
      # them. `event camera` matches only that exact phrase, so the whole
      # "event-based <task>" literature was invisible here.
      # Keep rate over 1827 curated items, against a 19.4% base rate:
      #   event-based 60.0% (30 hits, 18 kept), neuromorphic 55.6% (9, 5).
      # That is 3x the base rate — the strongest sensor vocabulary available.
      # Rejected: `event stream` (5 hits, 20% keep) and `dynamic range` — the
      # latter looks strong (18 uncovered items, 9 kept) but every one of them
      # is an event-camera paper using "high dynamic range" as boilerplate, so
      # putting it on Sensors would double-count this same class across two
      # tracks via the strongest + 0.6*rest relevance formula.
      - event-based
      - neuromorphic
    # `rgb-d` is a real depth-sensor term that RGB-D salient object detection
    # reuses verbatim — 7929 (SaliLLM) matched this track on it while being a
    # saliency benchmark for MLLMs. `salient object detection` is already a
    # global negative; as a guard it also removes the 3D Sensors relevance boost.
    # 4 Ignore / 0 kept among items carrying this track (61 Ignore / 52 kept).
    negative_keywords:
      - salient object detection

  - id: robotics-vision
    name: Robotics Vision
    quadrant: scene
    positive_keywords:
      - robotics
      - robot vision
      - visual servoing
      - visual odometry
      - slam
      - navigation
      - manipulation
      # Added 2026-08-07: 63% kept over 8 curated items (base rate 18.8%).
      # Item 3474 (SG2Loc) was routing on the bare word `robotics` alone.
      - visual localization
    # Added 2026-08-11. `navigation` is the weakest keyword on this track: 91
    # matches, and when it is the SOLE keyword carrying the track the keep rate
    # is 12.1% against a 19.3% base rate. The dominant wrong sense is
    # vision-and-language navigation, which has its own vocabulary and so can be
    # guarded per-track rather than penalised globally (a track guard is -12 on
    # the track score, worth ~3x a negative topic). Both phrasings hit zero kept
    # items over 1802 curated items, so no exemption is needed. Scoped
    # replacements for `navigation` itself were measured and rejected as too
    # thin to carry the track: `robot navigation` 4 hits, `visual navigation` 1,
    # `navigation system` 0.
    # `manipulation` means image manipulation as often as robot manipulation —
    # 2026-07-21 candidate 7 (6632, ExpertVerse, a knowledge-intensive *image
    # generation* benchmark) matched this track on "semantic manipulation" alone.
    # These three phrases are already global negative topics; repeating them here
    # removes the spurious relevance boost as well as the score penalty.
    #
    # `world generation` added 2026-07-23: 7215 (GS-Agent, LLM-agent-driven 4D
    # world creation) matched this track on "camera and lighting manipulation"
    # and says none of the three phrases above — it generates *worlds*, not
    # images. Probed over the corpus: 9 hits, none of them kept, and every one is
    # generative content creation or a driving world model. The narrower
    # `lighting manipulation` was rejected as a one-off phrasing.
    #
    # The forensics sense added 2026-07-30: 7752 (BG-REAL, a *background
    # manipulation* detection benchmark) matched this track on `manipulation`
    # alone and reached rank 5 of the 07-28 queue. Image forensics is the third
    # distinct wrong sense of the word, after image generation and world
    # generation. All three phrases are new global negative topics as well;
    # repeating them here removes the relevance boost too.
    negative_keywords:
      - image generation
      - image editing
      - text-to-image
      - world generation
      - manipulation detection
      - manipulation localization
      - image forensics
      # `image manipulation` added 2026-07-31: 7807 (FaithEyes) matched this
      # track because agentic VLMs call "code-based image manipulation" a tool.
      # That is the fourth distinct wrong sense of the word, after image
      # generation, world generation and forensics. 2 Ignore / 0 kept, and it
      # strips this track from 1 Ignore / 0 kept item. Left out of the global
      # negative list: `image editing` already penalises the same class.
      - image manipulation
      # `navigation` has the same PCB-routing wrong sense as `path planning` on
      # Robot Guidance — 8419 (OmniRouting) matched both tracks. See the note
      # there for why `pcb` itself is not usable as a guard. 1 Ignore / 0 kept.
      - electronic design automation
      - vision-language navigation
      - vision-and-language navigation

  - id: robot-guidance
    name: Robot Guidance
    quadrant: scene
    positive_keywords:
      - robot guidance
      - grasping
      - bin picking
      - pick and place
      - hand-eye calibration
      - path planning
      - pose refinement
    # `path planning` also means *trace* routing on a circuit board. 2026-08-06:
    # 8419 (OmniRouting, an LLM benchmark for PCB routing) reached this track and
    # Robotics Vision on `path planning` + `navigation` and took a top-10 queue
    # slot with no vision content at all. `pcb` and `printed circuit board` were
    # probed and REJECTED as guards — both hit kept items (2674, PCB defect
    # detection; 3175), because board *inspection* is the radar's own domain. The
    # EDA design sense has its own vocabulary, so guard on that instead: 1
    # in-track Ignore / 0 kept. One item, but this is a core track and a wrong
    # track match costs more than a missed penalty.
    negative_keywords:
      - electronic design automation

  - id: object-tracking
    name: Object Tracking
    quadrant: models
    positive_keywords:
      - object tracking
      - multi-object tracking
      - tracking
      - re-identification
      - temporal association
      - motion model
    # `gui` added 2026-07-30: 7576 (Desktop-Delta Bench, a computer-use-agent
    # benchmark) matched this track on the bare word `tracking`, from "source
    # tracking" of GUI state. Desktop-agent papers are a growing cs.CV class and
    # they all use this vocabulary. Probed: gui 9 Ignore / 0 kept.
    negative_keywords:
      - person re-identification
      - gui

  - id: industrial-vision-inspection
    name: Industrial Vision Inspection
    quadrant: tooling
    positive_keywords:
      - industrial inspection
      - visual inspection
      - defect detection
      # Added 2026-08-12. The bare morphological forms are the radar's single
      # strongest vocabulary and none of them were listed — whole-word matching
      # meant `defect detection` missed "defect segmentation", "defect
      # evidence" and "surface defects", and the two two-word `* inspection`
      # phrases missed "Semiconductor Inspection" and "Real-to-Twin Inspection".
      # Keep rate over 1827 curated items, against a 19.4% base rate:
      #   defect 82.1% (28 hits), defects 77.3% (22), inspection 57.8% (45),
      #   manufacturing 69.2% (13).
      # `defect` at 4.2x the base rate is the highest-signal keyword measured
      # anywhere in this config.
      # Kept ADDITIVE on purpose. Consolidating — dropping `industrial
      # inspection` / `visual inspection` / `defect detection` in favour of the
      # bare forms they subsume — was A/B'd and REJECTED: it demoted item 2042
      # (Industrial Inspection DINOv3, Evaluate) from rank 3 to 10 and dropped
      # 4622. Unlike the `open source` / `open-source` duplicate this is not
      # double-scoring for free: the long forms are strictly more on-domain
      # than the bare ones, and the extra weight encodes that.
      # Rejected as already covered (zero incremental items over the whole
      # corpus): `textureless`, `surface normal`, `mot`, `orin`.
      - inspection
      - defect
      - defects
      - manufacturing
      - anomaly detection
      - surface inspection
      - quality control
      - metrology
      - machine vision
      # Added 2026-08-18. Coverage hole exposed by item 9453 (YOLO26-RD,
      # Evaluate) landing at rank 23 of the 08-16 queue on the single word
      # `dataset`: it carries two modules built for exactly this track — a
      # 494-parameter differentiable CLAHE that adapts contrast per tile inside
      # the network, and a Sobel-gated space-to-depth downsample — but its
      # subject words are "damage" and "pavement distress", and the track had
      # no word for damage or cracking at all.
      # Keep rate over 1981 curated items, against a 20.3% base rate:
      #   crack 86% (7 hits), damage detection 100% (2), non-destructive 67% (3).
      # `crack` at 4.2x the base rate matches `defect`: its hits are structural
      # crack segmentation, steel fatigue micrographs and infrastructure
      # inspection, with one miss.
      # Rejected: `scratch` (22%, dead on the base rate — dominated by "trained
      # from scratch"), `pavement` (33%, 3 hits), `clahe` (25%),
      # `illumination` (26% over 61 hits — high volume, no signal),
      # `distress` (1 hit), `wear` (2 hits, 0 kept), `corrosion`/`weld` (0 hits
      # — kept out until the vocabulary actually appears).
      # `surface defect` (100%, 4) was dropped as pure redundancy: bare
      # `defect` already covers every one of its hits.
      - crack
      - damage detection
      - non-destructive
    # `anomaly detection` is one of this track's strongest positives (28 kept
    # items across the corpus) and is also the phrase medical papers use for
    # exactly the same task. Added 2026-07-30 after 7621 (Group Equivariant
    # Diffusion for Anomaly Detection in Computational Cytology) matched this
    # track on it alone. Measured over the decided corpus: 21 Ignore / 28 kept
    # items say `anomaly detection`; 6 of the Ignore items pair it with one of
    # the guards below, and *no* kept item does.
    # `medical imaging` was rejected as a guard: it hits 576 (AnomalyClaw, a kept
    # general visual anomaly-detection agent that lists medical imaging as one
    # application domain). The singular `medical image` does not — the matcher is
    # whole-word — so that is the form listed.
    negative_keywords:
      - cytology
      - whole-slide
      - histopathology
      - medical image
      - clinical
      # `radiomics` added 2026-07-31: 7787 (volume-driven confounding in
      # radiomics features) matched this track on `quality control`, from its
      # "scalable quality-control strategy" for oncology biomarkers. Same shape
      # as the `anomaly detection` case above — a strong inspection positive that
      # medical papers use verbatim. 3 Ignore / 0 kept; strips this track from
      # 1 Ignore / 0 kept.
      - radiomics
      # 2026-08-03, same shape again — medical papers reusing this track's
      # strongest positives. In-track counts over 31 Ignore / 45 kept:
      #   * mri 4/0 — a global negative already; guarding here strips the track.
      #   * optical coherence tomography 1/0 — 7949 (ReMoE) matched Industrial
      #     Vision Inspection purely on `anomaly detection` in a retinal OCT
      #     paper. One item, but this track is the radar's core domain and a
      #     wrong track match costs more than a missed penalty.
      - mri
      - optical coherence tomography
      # 2026-08-05: the same shape once more, but non-medical for a change.
      # 8191 (PRISM) matched this track on `anomaly detection` alone while being
      # a *time-series* anomaly-detection paper whose named applications are
      # finance and cloud computing — it renders series as images only to reuse
      # ImageNet backbones. 7 Ignore / 0 kept corpus-wide; scoped here rather
      # than made a global negative because the phrase is harmless outside this
      # track and the fault is the track match, not the item's presence.
      - time series
      # 2026-08-06, two more wrong senses of this track's positives in one queue:
      #   * `ultrasound` — 8365 (FUSEP, a fetal-ultrasound screening benchmark)
      #     matched this track on `quality control`, from "quality control on
      #     ultrasound images". It is already a global negative topic, so the
      #     penalty fired but the track match survived. 2 in-track Ignore / 0
      #     kept, and all 224 corpus occurrences are clinical — industrial NDT
      #     says "ultrasonic" (2 corpus hits, neither in this track), so our own
      #     domain is untouched. NOTE the asymmetry: negative_topics.yaml scopes
      #     `ultrasound` through its `exemptions:` map, but track guards have no
      #     such escape hatch — classify_item applies negative_keywords
      #     unconditionally. Bare `ultrasound` is only safe here because the two
      #     senses do not share a word; do not copy this pattern for a phrase
      #     that needs an exemption.
      #   * surveillance video anomaly detection — 8337 (VQ-VAD, pose-based
      #     anomaly detection in surveillance footage) matched on `anomaly
      #     detection`. Bare `surveillance` was probed and REJECTED: it hits kept
      #     item 24 (SphereVAD). The two-word forms do not. `video anomaly
      #     detection` was rejected for the same reason — it hits kept 6730
      #     (O-VAD, *industrial* video anomaly detection), which is exactly the
      #     item this guard must never touch. `surveillance video` was probed and
      #     also REJECTED: its only in-track effect is stripping 5241, a
      #     cross-dataset audit showing frozen-backbone AD collapses to chance
      #     off its training scene — it is framed on surveillance data but tests
      #     a PaDiM-style Mahalanobis detector, so the finding is industrial-AD
      #     relevant and the track match is earned.
      - ultrasound
      - surveillance footage
      # Added 2026-08-24. Two false-context senses reach this track through its
      # own strongest keywords, and a per-track guard is worth ~3x a negative
      # topic (-12 on the track score vs ~-3.8 on the final score).
      #
      # `ai-generated image`: 9849 (AGIDefect-4K) hit rank 2 of the 08-21 queue
      # because its "defects" are generative artifacts in synthesised images,
      # firing `defect`, `defect detection` AND `defects` at once. 1 on-track
