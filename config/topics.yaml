  - id: datasets-benchmarks
    name: Datasets & Benchmarks
    quadrant: models
    positive_keywords:
      - dataset
      - benchmark
      - leaderboard
      - test set
      # `test set` re-probed 2026-08-28 and REJECTED for the second time, with
      # a lesson about the A/B window attached. On the current corpus it is
      # still the weakest keyword here (11.8% keep over 68 matches against a
      # 23.1% base rate), and over a 27-day window removing it looked free:
      # 12 items out (8 decided Ignore, 4 undecided and off-domain — glioma
      # segmentation, radiologist gaze, image insertion, adversarial fusion),
      # kept item 9946 (LF-GICP LiDAR odometry, Evaluate) pulled in, zero kept
      # items dropped. Re-run over 06-01..08-27 it reproduces the original
      # rejection exactly: 7192 (Watch) drops out of its queue, and 4924
      # (Watch) 15 -> 23, 7928 (Prototype) 11 -> 21, 9143 (Evaluate) 10 -> 19,
      # 9856 (Watch) 11 -> 18 all pay rank. A 27-day window is too short to
      # clear a positive-keyword removal — use at least a quarter.
      #
      # Probed the same way and REJECTED because they drop kept items:
      # `sam` (15.9%, n=69) evicts 8020 and 10549 — the latter is the 08-26
      # zero-shot tower-component inspection paper decided Evaluate that same
      # day — and `clip` (17.4%, n=121) evicts 9146. Below the base rate but
      # not empty: unlike `test set` they name a specific tool the radar tracks.
      - ground truth
      # `evaluation protocol` removed 2026-08-11: 40 matches at a 10.0% keep
      # rate, 0.52x the 19.3% base rate. It is a methods-section phrase, not a
      # subject-matter word. Measured over 49 dates: 7 decided-Ignore items
      # pushed out, zero kept items moved.
      # `test set` (52 matches, 5.8% keep, 0.30x base - the worst ratio in the
      # config) was A/B'd and REJECTED for now: removing it cost 4924 and 7192,
      # both Watch.
      # `benchmark` (694 matches, 11.8% keep, 304 of them as the SOLE keyword
      # carrying this track at an 11.5% keep rate) is the single largest lever
      # left, and 2026-08-12 finally establishes WHY it must stay. Removing it
      # is by far the biggest measurable win available - 174 decided-Ignore
      # items pushed out over 49 dates, only 2 kept items dropped - but the 19
      # kept items it demotes are, specifically, this radar's own
      # industrial-inspection benchmark papers:
      #   6806 Semiconductor Inspection low-false-call benchmark  14 -> 20
      #   8826 LIBAD Li-ion electrode anomaly benchmark            7 -> 13
      #   5879 ICME cross-scenario defect detection challenge      11 -> 18
      #   1010 Multi-class battery detection                        7 -> 18
      #   7172 DRGBT-1K tracking benchmark                          5 -> 20
      # An on-domain paper that publishes a benchmark is exactly what this
      # radar wants to rank highly, and `benchmark` is what lifts it. REJECTED
      # for the third time; treat this as settled unless the track is redesigned.
      # Both are symptoms of the standing design question - this track
      # classifies paper FORMAT, not subject - which a keyword edit cannot fix.
      # The productive direction is the opposite one: add subject vocabulary
      # (see the 2026-08-12 additions to Industrial Vision Inspection and 3D
      # Sensors) so on-domain papers stop depending on the format track at all.
    negative_keywords: []
