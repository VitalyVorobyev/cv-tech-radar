negative_topics:
  - face recognition
  - person re-identification
  - fashion retrieval
  - medical segmentation
  - remote sensing
  - diffusion art generation
  - video generation
  - image generation
  # MLLM/VLM-evaluation noise — added after 2026-05-11 and 2026-05-08 curation
  # showed 14 false positives in 50 candidates. Phrases are chosen to fire on
  # MLLM-eval papers without breaking legitimate vision-foundation-model work
  # (DINOv2 / SAM / CLIP papers don't use these phrases verbatim).
  - vision-language
  - multimodal large language
  - image editing
  - omnimodal
  # Autonomous-driving noise — item 354 (CARD) slipped into Use on the seed-script
  # path with no negative penalty despite an abstract that opens with
  # "Autonomous driving must operate...". The radar is industrial CV focused
  # (calibration, feature detection, segmentation, inspection) — cars/lidars
  # for AD are an unrelated stack. `lidar` stays a positive keyword because
  # it's a legitimate industrial 3D sensor.
  - autonomous driving
  - self-driving
  # Video-deflickering noise — 2026-05-20 item 1766 (VDFP) floated into the top
  # 25 and matched the Calibration & Camera Models + Sensors tracks purely
  # because screen-capture flicker-banding papers mention "rolling shutter".
  # `rolling shutter` stays a positive keyword (it's a real calibration/sensor
  # topic); `deflickering` is specific to the video-restoration task and does
  # not collide with any radar track.
  - deflickering
  # Medical-imaging noise — 2026-05-21 curation queued 5 medical papers into 25
  # candidate slots (VEELA CTA vessel segmentation, OSS surgical-skill
  # assessment, case-aware medical-image classification, two frozen-VFM/VLM
  # medical benchmarks). `medical segmentation` above was too narrow: those
  # abstracts say "computed tomography", "surgical", "medical imaging" instead.
  # The radar is industrial-CV focused (calibration, inspection, 3D sensors,
  # tracking, OSS tooling); medical imaging is an unrelated domain and these
  # phrases are medical-specific enough not to collide with any radar track.
  - medical imaging
  - computed tomography
  - histopathology
  - surgical
  - clinical
  # Image-restoration / super-resolution / T2I-decoder noise — 2026-05-22
  # queued three restoration/generation papers (SANA-SR one-step diffusion SR,
  # PixIE low-light enhancement, PiD pixel-diffusion text-to-image decoder)
  # that piggy-backed on `dinov2`, `foundation model`, `reconstruction`,
  # `pruning`, and `deployment` matches. Generic image restoration / SR /
  # enhancement / T2I are outside the radar (we already filter `image editing`,
  # `image generation`, `video generation`); these phrases close the obvious
  # remaining gap without colliding with any positive radar keyword.
  - super-resolution
  - image restoration
  - low-light image enhancement
  - text-to-image
