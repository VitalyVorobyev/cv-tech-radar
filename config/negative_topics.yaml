  # generation / egocentric wearable vision) is outside the industrial-CV radar.
  # Scope is deliberately the two-word `human <x>` phrase (NOT bare `pose`):
  # `pose estimation` / `pose refinement` / `motion model` stay POSITIVE
  # calibration keywords, and a camera-pose paper never says "human pose". The
  # phrases avoid the existing "human performance" MMVIAD guard fixture (that is
  # "human-level performance", not a human-body topic). `egocentric` is a clean
  # first-person / wearable-AR marker that collides with no radar keyword (and
  # does not fire on "egomotion", a different token).
