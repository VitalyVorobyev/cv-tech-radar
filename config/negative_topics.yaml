  # Biometric identity / authentication noise — the 2026-07-23 queue held THREE
  # such papers at zero penalty (7283 MAGE-Vein finger-vein age/gender, 7212
  # occlusion-aware iris recognition, 7261 text-based person retrieval), and a
  # fourth (7282 face anti-spoofing) missed the top-25 only narrowly. The two
  # existing phrases cover the class far too narrowly: `face recognition` is one
  # modality and `person re-identification` misses the "person retrieval"
  # phrasing. Identity verification is a distinct field from the industrial-CV
  # radar — the modalities (iris, vein, periocular, gait, signature) share no
  # vocabulary with calibration, inspection, 3D or tracking work.
  #
  # Probed over the full 7299-item corpus: the ten phrases below hit 58 items and
  # NOT ONE of the 249 items the curator kept. Deliberately omitted:
  #   * bare `fingerprint` (29 hits) — polysemous. It is the standard term for
  #     AI-generated-image attribution, behavioural telemetry, model watermarking
  #     and thermal side channels. `biometric`/`biometrics` already catches the
  #     genuine fingerprint-biometrics papers (4023, 4476, 3871).
  #   * `palmprint` and `vein recognition` — zero marginal coverage; every item
  #     they hit is already caught, so they would only double-count the penalty.
  #   * bare `iris`, `gait`, `signature`, `spoofing` — all collide with unrelated
  #     senses (`signature` in particular: "spectral signature").
  # `biometrics` is listed alongside `biometric` because matching is whole-word:
  # `\bbiometric\b` does not fire on "biometrics", and the plural alone uniquely
  # covers four items. Accepted cost: `gait recognition` also catches 1985
  # (EventGait), an event-camera paper — the sensor is interesting but the task
  # is surveillance biometrics, and the phrase is scoped tightly enough that
  # event-camera *tracking* or *sensing* work is untouched.
  - biometric
  - biometrics
  - iris recognition
  - periocular
  - finger vein
  - gait recognition
  - signature verification
  - presentation attack
  - anti-spoofing
  - person retrieval
