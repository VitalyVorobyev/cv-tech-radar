  #     retrieval task rather than naming the sensor.
  #   * `collaborative perception` (3/2) — hits 4395 (HERCULES multi-robot SLAM
  #     simulator, kept Evaluate) and 7172 (DRGBT-1K, kept Watch).
  #   * `long-tailed` (7/1) — hits 717, a kept MOT paper.
  #   * `ocr` (13/0) and `text recognition` (11/1) — rejected on forward risk plus
  #     one kept hit: optical character verification on part markings and date
  #     codes is a standard machine-vision function, i.e. the radar's own domain.
  #   * `forensic` (14/0) — the highest-volume option, but the corpus already
  #     shows the figurative register ("genuine forensic logic" in 7733, a
  #     reasoning benchmark). Scoped to the three task names instead.
  #   * `eye-tracking` (5/1), `gaze` (8/1), `saliency prediction` (0/2),
  #     `bird's eye view` (16/2) — each touches a kept item.
  - cancer
  - whole-slide
  - scientific figure
  - document understanding
  - handwriting
  - video editing
  - salient object detection
  - manipulation detection
  - manipulation localization
  - image forensics
  - cross-view geo-localization
  - drone-view
  - dataset distillation
  - taxonomic
  - fall detection
  - v2xset
  - opv2v

# Domain-ambiguous negatives: the phrase stays in the list above, but the penalty
# is suppressed when any guard phrase also appears in the item text. Added
# 2026-07-22 after the 07-15..07-21 backfill showed the negative filter
# penalising the radar's *core* domain — the worst failure mode available to it:
#   * 7081 XCT-SAM (defect segmentation on additive-manufacturing X-ray CT) lost
#     25 points to the medical `computed tomography` negative. Industrial XCT is
#     NDT inspection, not radiology.
#   * 6806 ("Does Super-Resolution Preserve Defect Evidence?", a low-false-call
#     semiconductor inspection benchmark) lost 25 points to `super-resolution`,
#     even though its finding — learned SR wins on SSIM while detecting fewer
#     defect pixels than bicubic — is directly actionable for inspection work.
# Both phrases stay valuable against medical and restoration noise, so they are
# scoped rather than dropped. Simulated over the full 557-item window, these
# guards exempt exactly those two items and nothing else.
exemptions:
  computed tomography:
    - industrial
    - additive manufacturing
    - non-destructive
    - nondestructive
    - weld
    - casting
    - semiconductor
  super-resolution:
    - defect
    - inspection
    - semiconductor
    - metrology
    - wafer
  # `ultrasound` (2026-07-27) is medical sonography, but ultrasonic NDT is a core
  # industrial inspection modality. The two normally use different words —
  # industrial abstracts say "ultrasonic testing", which the whole-word matcher
  # does not fire on — so this guard is pre-emptive rather than corrective: no
  # item in the 1125-item decided corpus is exempted by it today.
  ultrasound:
    - non-destructive
    - nondestructive
    - weld
