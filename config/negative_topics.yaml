  # MLLM/VLM-evaluation noise — added after 2026-05-11 and 2026-05-08 curation
  # showed 14 false positives in 50 candidates. Phrases are chosen to fire on
  # MLLM-eval papers without breaking legitimate vision-foundation-model work
  # (DINOv2 / SAM / CLIP papers don't use these phrases verbatim).
  - vision-language
  - multimodal large language
  - image editing
  - omnimodal
  # Autonomous-driving noise — item 354 (CARD) slipped into Use on the seed-script
  # path with no negative penalty despite an abstract that opens with
  # "Autonomous driving must operate...". The radar is industrial CV focused
  # (calibration, feature detection, segmentation, inspection) — cars/lidars
  # for AD are an unrelated stack. `lidar` stays a positive keyword because
  # it's a legitimate industrial 3D sensor.
  - autonomous driving
  - self-driving
  # Video-deflickering noise — 2026-05-20 item 1766 (VDFP) floated into the top
  # 25 and matched the Calibration & Camera Models + Sensors tracks purely
  # because screen-capture flicker-banding papers mention "rolling shutter".
  # `rolling shutter` stays a positive keyword (it's a real calibration/sensor
  # topic); `deflickering` is specific to the video-restoration task and does
  # not collide with any radar track.
  - deflickering
