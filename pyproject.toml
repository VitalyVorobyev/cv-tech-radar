[project]
name = "cv-radar"
version = "0.1.0"
description = "Personal-first computer-vision technology radar."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.139.0",
    "feedparser>=6.0.11",
    "httpx>=0.28.1",
    "pydantic>=2.11.0",
    "pyyaml>=6.0.2",
    "rich>=13.9.0",
    "ruamel.yaml>=0.18.6",
    "sqlalchemy>=2.0.51",
    "typer>=0.26.7",
    "uvicorn[standard]>=0.51.0",
]

[project.scripts]
radar = "radar.cli:app"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["radar"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
